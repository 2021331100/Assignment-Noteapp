name: Backend CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run API tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 4300
          MONGODB_URI: mongodb://127.0.0.1:27017/secure_notes_test
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests-123456
          CORS_ORIGIN: http://localhost:3000
          TRUST_PROXY_HOPS: 0
