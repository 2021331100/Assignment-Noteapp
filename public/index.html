<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Taking API</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Note Taking App</h1>
      <div class="nav-actions">
        <button id="show-register">Register</button>
        <button id="show-login">Login</button>
        <button id="show-dashboard">Dashboard</button>
        <button id="show-admin">Admin</button>
        <button id="logout-btn" class="danger">Logout</button>
      </div>
    </header>

    <main class="container">
      <section id="auth-section" class="panel">
        <div id="register-panel" class="card active">
          <h2>Register</h2>
          <form id="register-form">
            <input type="text" id="register-name" placeholder="Full name" required />
            <input type="email" id="register-email" placeholder="Email" required />
            <input type="password" id="register-password" placeholder="Password" required />
            <input type="text" id="register-interests" placeholder="Interests (comma separated)" />
            <button type="submit">Register</button>
          </form>
        </div>

        <div id="login-panel" class="card hidden">
          <h2>Login</h2>
          <form id="login-form">
            <input type="email" id="login-email" placeholder="Email" required />
            <input type="password" id="login-password" placeholder="Password" required />
            <button type="submit">Login</button>
          </form>
        </div>
      </section>

      <section id="dashboard-section" class="panel hidden">
        <div class="card">
          <h2>User Dashboard</h2>
          <div id="profile-box"></div>
        </div>

        <div class="card">
          <h3>Create Note</h3>
          <form id="create-note-form">
            <input type="text" id="note-title" placeholder="Note title" required />
            <textarea id="note-content" placeholder="Note content" required></textarea>
            <button type="submit">Create Note</button>
          </form>
        </div>

        <div class="card">
          <h3>My Notes</h3>
          <div id="notes-list"></div>
        </div>
      </section>

      <section id="admin-section" class="panel hidden">
        <div class="card">
          <h2>Admin Dashboard</h2>
          <h3>Create User</h3>
          <form id="admin-create-user-form">
            <input type="text" id="admin-user-name" placeholder="Name" required />
            <input type="email" id="admin-user-email" placeholder="Email" required />
            <input type="password" id="admin-user-password" placeholder="Password" required />
            <select id="admin-user-role">
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
            <input type="text" id="admin-user-interests" placeholder="Interests" />
            <button type="submit">Create User</button>
          </form>
        </div>

        <div class="card">
          <h3>All Users</h3>
          <div id="admin-users-list"></div>
        </div>

        <div class="card">
          <h3>All Notes</h3>
          <div id="admin-notes-list"></div>
        </div>

        <div class="card">
          <h3>Users Grouped by Interests</h3>
          <div id="interest-groups"></div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
